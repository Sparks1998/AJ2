server:
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:./france-travail-credentials.yaml
  web:
    error:
      include-exception: true
      include-message: always
      include-binding-errors: always
      include-stacktrace: on_param
      include-path: always
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:-1}
      max-request-size: ${MAX_REQUEST_SIZE:-1}
      enabled: true
  application:
    name: ${APP_NAME:AJ2}
  jpa:
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        enable_lazy_load_no_trans: false
    generate-ddl: false
  datasource:
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aj2}?currentSchema=${DB_SCHEMA:aj2}
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/liquibase-ChangeLog.yaml
    liquibase-schema: ${DB_SCHEMA:aj2}
    default-schema: ${DB_SCHEMA:aj2}

security:
  jwt:
    keystore:
      location: ${AJ2_JWT_KEYSTORE_LOCATION:file:./aj2-jwt.p12}
      password: ${AJ2_JWT_KEYSTORE_PASSWORD:Aj2JwtDev@2026!}
      alias: ${AJ2_JWT_KEYSTORE_ALIAS:aj2-jwt}
      key-password: ${AJ2_JWT_KEYSTORE_KEY_PASSWORD:${AJ2_JWT_KEYSTORE_PASSWORD:Aj2JwtDev@2026!}}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  token:
    rotate-after-requests: ${TOKEN_ROTATE_AFTER_REQUESTS:20}

app:
  file-storage:
    base-dir: ${FILE_STORAGE_BASE_DIR:./uploads}

firebase:
  credentials-location: ${FIREBASE_CREDENTIALS_LOCATION:file:./firebase-service-account.json}

france-travail:
  client-id: ${FRANCE_TRAVAIL_CLIENT_ID:}
  client-secret: ${FRANCE_TRAVAIL_CLIENT_SECRET:}
  token-url: ${FRANCE_TRAVAIL_TOKEN_URL:https://entreprise.francetravail.fr/connexion/oauth2/access_token?realm=/partenaire}
  scope: ${FRANCE_TRAVAIL_SCOPE:api_offresdemploiv2 o2dsoffre}
  offers-url: ${FRANCE_TRAVAIL_OFFERS_URL:https://api.francetravail.io/partenaire/offresdemploi/v2/offres}
