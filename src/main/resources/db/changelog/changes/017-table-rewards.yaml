databaseChangeLog:
  - changeSet:
      id: 017-table-rewards
      author: Abbass Charara
      changes:
        - createTable:
            tableName: rewards
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: image_url
                  type: VARCHAR
              - column:
                  name: reward_rule_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: rule_threshold
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: stock
                  type: INT
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: rewards
            baseColumnNames: reward_rule_id
            constraintName: fk_rewards_reward_rule
            referencedTableName: reward_rules
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_rewards_reward_rule_id
            tableName: rewards
            columns:
              - column:
                  name: reward_rule_id
      rollback:
        - dropTable:
            tableName: rewards
