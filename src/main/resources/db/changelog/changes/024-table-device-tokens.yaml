databaseChangeLog:
  - changeSet:
      id: 024-table-device-tokens
      author: Abbass Charara
      changes:
        - createTable:
            tableName: device_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: fcm_token
                  type: VARCHAR
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: auth_token_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: platform
                  type: device_platform
                  constraints:
                    nullable: false
              - column:
                  name: last_used_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: device_tokens
            baseColumnNames: user_id
            constraintName: fk_device_tokens_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: device_tokens
            baseColumnNames: auth_token_id
            constraintName: fk_device_tokens_auth_token
            referencedTableName: auth_tokens
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_device_tokens_user_id
            tableName: device_tokens
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: device_tokens
