databaseChangeLog:
  - changeSet:
      id: 009-enum-user-gender
      author: Abbass Charara
      changes:
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TYPE user_gender AS ENUM ('MALE', 'FEMALE');
      rollback:
        - sql:
            sql: DROP TYPE IF EXISTS user_gender;
