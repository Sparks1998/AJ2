databaseChangeLog:
  - changeSet:
      id: 019-table-workshop-registration
      author: Abbass Charara
      changes:
        - createTable:
            tableName: workshop_registration
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: workshop_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: registered_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: attended_at
                  type: TIMESTAMP WITH TIME ZONE
        - addForeignKeyConstraint:
            baseTableName: workshop_registration
            baseColumnNames: workshop_id
            constraintName: fk_workshop_registration_workshop
            referencedTableName: workshop
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: workshop_registration
            baseColumnNames: user_id
            constraintName: fk_workshop_registration_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_workshop_registration_workshop_id
            tableName: workshop_registration
            columns:
              - column:
                  name: workshop_id
        - createIndex:
            indexName: idx_workshop_registration_user_id
            tableName: workshop_registration
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: workshop_registration
