databaseChangeLog:
  - changeSet:
      id: 022-table-notifications
      author: Abbass Charara
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: TEXT
              - column:
                  name: payload
                  type: JSONB
              - column:
                  name: read_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: user_id
            constraintName: fk_notifications_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_notifications_user_id
            tableName: notifications
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: notifications
