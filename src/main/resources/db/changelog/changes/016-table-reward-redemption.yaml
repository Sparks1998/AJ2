databaseChangeLog:
  - changeSet:
      id: 016-table-reward-redemption
      author: Abbass Charara
      changes:
        - createTable:
            tableName: reward_redemption
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: reward_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: xp_spent
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: redemption_status
                  constraints:
                    nullable: false
              - column:
                  name: redeemed_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: reward_redemption
            baseColumnNames: user_id
            constraintName: fk_reward_redemption_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: reward_redemption
            baseColumnNames: reward_id
            constraintName: fk_reward_redemption_reward
            referencedTableName: reward
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_reward_redemption_user_id
            tableName: reward_redemption
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_reward_redemption_reward_id
            tableName: reward_redemption
            columns:
              - column:
                  name: reward_id
      rollback:
        - dropTable:
            tableName: reward_redemption
