databaseChangeLog:
  - changeSet:
      id: 019-table-job-applications
      author: Abbass Charara
      changes:
        - createTable:
            tableName: job_applications
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: source_ref
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: company
                  type: VARCHAR
              - column:
                  name: application_url
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: opened_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: job_applications
            baseColumnNames: user_id
            constraintName: fk_job_applications_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - addUniqueConstraint:
            tableName: job_applications
            columnNames: user_id, source, source_ref
            constraintName: uq_job_applications_user_source_source_ref
      rollback:
        - dropTable:
            tableName: job_applications
