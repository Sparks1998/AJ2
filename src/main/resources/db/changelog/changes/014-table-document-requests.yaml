databaseChangeLog:
  - changeSet:
      id: 014-table-document-requests
      author: Abbass Charara
      changes:
        - createTable:
            tableName: document_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: document_type_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: requested_by
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: document_mission_id
                  type: UUID
              - column:
                  name: status
                  type: document_status
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: TEXT
              - column:
                  name: requested_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: DATE
        - addForeignKeyConstraint:
            baseTableName: document_requests
            baseColumnNames: user_id
            constraintName: fk_document_requests_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: document_requests
            baseColumnNames: document_type_id
            constraintName: fk_document_requests_document_type
            referencedTableName: document_types
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: document_requests
            baseColumnNames: requested_by
            constraintName: fk_document_requests_requested_by
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: document_requests
            baseColumnNames: document_mission_id
            constraintName: fk_document_requests_document_mission
            referencedTableName: mission_templates
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_document_requests_user_id
            tableName: document_requests
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_document_requests_document_type_id
            tableName: document_requests
            columns:
              - column:
                  name: document_type_id
        - createIndex:
            indexName: idx_document_requests_requested_by
            tableName: document_requests
            columns:
              - column:
                  name: requested_by
        - createIndex:
            indexName: idx_document_requests_document_mission_id
            tableName: document_requests
            columns:
              - column:
                  name: document_mission_id
      rollback:
        - dropTable:
            tableName: document_requests
