databaseChangeLog:
  - changeSet:
      id: 016-table-reward-rules
      author: Abbass Charara
      changes:
        - createTable:
            tableName: reward_rules
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: title
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
      rollback:
        - dropTable:
            tableName: reward_rules
