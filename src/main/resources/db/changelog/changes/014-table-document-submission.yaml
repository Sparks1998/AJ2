databaseChangeLog:
  - changeSet:
      id: 014-table-document-submission
      author: Abbass Charara
      changes:
        - createTable:
            tableName: document_submission
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: document_request_id
                  type: UUID
              - column:
                  name: document_mission_id
                  type: UUID
              - column:
                  name: file_key
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: mime_type
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: submitted_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: reviewed_by
                  type: UUID
              - column:
                  name: reviewed_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: review_comment
                  type: TEXT
        - addForeignKeyConstraint:
            baseTableName: document_submission
            baseColumnNames: document_request_id
            constraintName: fk_document_submission_document_request
            referencedTableName: document_request
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: document_submission
            baseColumnNames: document_mission_id
            constraintName: fk_document_submission_document_mission
            referencedTableName: mission_template
            referencedColumnNames: id
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: document_submission
            baseColumnNames: reviewed_by
            constraintName: fk_document_submission_reviewed_by
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_document_submission_document_request_id
            tableName: document_submission
            columns:
              - column:
                  name: document_request_id
        - createIndex:
            indexName: idx_document_submission_document_mission_id
            tableName: document_submission
            columns:
              - column:
                  name: document_mission_id
        - createIndex:
            indexName: idx_document_submission_reviewed_by
            tableName: document_submission
            columns:
              - column:
                  name: reviewed_by
        - sql:
            dbms: postgresql
            splitStatements: true
            stripComments: true
            sql: |
              ALTER TABLE document_submission
                ADD CONSTRAINT chk_document_submission_request_or_mission
                CHECK (document_request_id IS NOT NULL OR document_mission_id IS NOT NULL);
      rollback:
        - dropTable:
            tableName: document_submission
