databaseChangeLog:
  - changeSet:
      id: 017-table-job-application
      author: Abbass Charara
      changes:
        - createTable:
            tableName: job_application
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: source_ref
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: company
                  type: VARCHAR
              - column:
                  name: application_url
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: opened_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: job_application
            baseColumnNames: user_id
            constraintName: fk_job_application_user
            referencedTableName: users
            referencedColumnNames: id
            onDelete: RESTRICT
        - createIndex:
            indexName: idx_job_application_user_id
            tableName: job_application
            columns:
              - column:
                  name: user_id
      rollback:
        - dropTable:
            tableName: job_application
